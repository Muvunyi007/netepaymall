name: Deploy Web + Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH to server -> run deploy-remote.sh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          API_URL: ${{ vars.API_URL || secrets.API_URL || 'http://167.88.36.40:8000' }}
          REMOTE_DIR: ${{ secrets.DEPLOY_DIR || vars.DEPLOY_DIR || '/root/netepaymall' }}
          REPO: https://github.com/Muvunyi007/netepaymall.git
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "${SSH_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_HOST" \
            "REMOTE='$REMOTE_DIR' API_URL='$API_URL' REPO='$REPO'" \
            'bash -s' < infrastructure/deploy-remote.sh