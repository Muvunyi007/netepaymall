name: Deploy Web + Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH to server -> bootstrap + git pull + build + restart
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          API_URL: ${{ vars.API_URL || secrets.API_URL || 'http://167.88.36.40:8000' }}
          REMOTE_DIR: ${{ secrets.DEPLOY_DIR || vars.DEPLOY_DIR || '/root/netepaymall' }}
          REPO: https://github.com/Muvunyi007/netepaymall.git
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "${SSH_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_HOST" \
            "REMOTE='$REMOTE_DIR' API_URL='$API_URL' REPO='$REPO' bash -s" <<'REMOTE'
          set -euo pipefail

          echo "==> [1/5] Install prerequisites (node18, npm, git, nginx if missing)"
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "FATAL: apt-get not found (needed for bootstrap)"; exit 1
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y -qq
          if ! command -v git >/dev/null 2>&1; then apt-get install -y -qq git; fi
          if ! command -v node >/dev/null 2>&1 || ! node --version | grep -qE '^v(18|20)\.'; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y -qq nodejs
          fi
          if ! command -v npm >/dev/null 2>&1; then apt-get install -y -qq npm; fi
          if ! command -v nginx >/dev/null 2>&1; then apt-get install -y -qq nginx; fi
          node --version; npm --version; git --version

          echo "==> [2/5] Clone/pull repo"
          mkdir -p "$REMOTE"
          cd "$REMOTE"
          if [ ! -d .git ]; then
            git clone "$REPO" .
          else
            git fetch origin main && git reset --hard origin/main
          fi

          echo "==> [3/5] Build web + admin"
          for app in web admin; do
            cd "$REMOTE/$app"
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            NEXT_PUBLIC_API_URL="$API_URL" npm run build
          done

          echo "==> [4/5] systemd services (web:8001, admin:8002)"
          USR="$(id -un)"
          for entry in "web:8001" "admin:8002"; do
            name="${entry%%:*}"; port="${entry##*:}"; svc="netepamall-$name"
            cat > "/etc/systemd/system/$svc.service" <<UNIT
          [Unit]
          Description=NETEPAMALL $name (Next.js)
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=$REMOTE/$name
          Environment=NODE_ENV=production
          Environment=PORT=$port
          ExecStart=/usr/bin/npm run start -- -p $port
          Restart=always
          RestartSec=5
          User=$USR

          [Install]
          WantedBy=multi-user.target
          UNIT
            systemctl daemon-reload
            systemctl enable "$svc"
            systemctl restart "$svc"
          done

          echo "==> [5/5] nginx (web on :80, admin on :8002)"
          cat > /etc/nginx/sites-available/netepaymall <<NGINX
          server {
              listen 80 default_server;
              server_name _;
              client_max_body_size 25M;
              location / { proxy_pass http://127.0.0.1:8001; proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade; proxy_set_header Connection "upgrade";
                  proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto \$scheme; }
          }
          NGINX
          ln -sf /etc/nginx/sites-available/netepaymall /etc/nginx/sites-enabled/netepaymall
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl reload nginx || systemctl restart nginx || true

          echo "DEPLOY OK"
          echo "Web:  http://$(hostname -I 2>/dev/null | awk '{print $1}')   Admin: http://$(hostname -I 2>/dev/null | awk '{print $1}'):8002"
          REMOTE